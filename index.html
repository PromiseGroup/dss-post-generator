<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator posta – Data Science Summit</title>
  <style>
    :root {
      --bg: #00122a;
      --card: #193357;
      --text: #f8fafc;
      --muted: #99aac2;
      --primary: #2c71f5;
      --primary-hover: #1a5fe0;
      --accent: #01ffaa;
      --border: #2d4c76;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255, 255, 255, 0.06), transparent 55%),
        var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .brand-divider {
      width: 1px;
      align-self: stretch;
      margin: 4px 0;
      background: var(--border);
      flex: none;
    }

    .logo {
      display: block;
      width: auto;
      max-width: 42%;
      object-fit: contain;
    }

    .logo-pg { height: 32px; }

    .logo-dss { height: 46px; }

    .content {
      padding: 20px 20px 24px;
    }

    h1 {
      font-size: 1.25rem;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .post-box {
      position: relative;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      min-height: 240px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: vertical;
    }

    textarea:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    .loader {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 18, 42, 0.9);
      border-radius: 12px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .loader.active { display: flex; }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button, .btn-link {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }

    button:active, .btn-link:active { transform: scale(0.98); }

    .btn-copy {
      background: var(--accent);
      color: #022c22;
    }

    .btn-linkedin {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-linkedin:hover { background: var(--primary-hover); }

    .btn-regen {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      padding: 11px;
    }

    .btn-regen:hover { color: var(--text); border-color: var(--muted); }

    .error {
      color: #f87171;
      font-size: 0.85rem;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="brand">
      <img class="logo logo-pg" src="https://promisegroup.com/wp-content/uploads/2026/11/Promise-Group-white-no-safety.svg" alt="Promise Group">
      <span class="brand-divider" aria-hidden="true"></span>
      <img class="logo logo-dss" src="https://promisegroup.com/wp-content/uploads/2026/11/LogoDSS-ColorWhite-F5F5F5.svg" alt="Data Science Summit">
    </header>
    <div class="content">
    <h1>Twój post z Data Science Summit</h1>
    <p class="subtitle">Skopiuj tekst, otwórz LinkedIn, wklej treść i dodaj zdjęcie ze stoiska.</p>

    <div id="errorMsg" class="error"></div>

    <div class="post-box">
      <textarea id="postText" placeholder="Generowanie posta..."></textarea>
      <div id="loader" class="loader active">
        <div class="spinner"></div>
        <span>Piszę post...</span>
      </div>
    </div>

    <div class="actions">
      <button id="copyBtn" class="btn-copy" type="button">1. Kopiuj tekst</button>
      <a id="linkedinBtn" class="btn-link btn-linkedin" href="https://www.linkedin.com/feed/?shareActive=true" target="_blank" rel="noopener">
        2. Otwórz LinkedIn
      </a>
      <button id="regenBtn" class="btn-regen" type="button">↻ Losuj inną wersję</button>
    </div>
    </div>
  </div>

  <script>
    const FLOW_URL = "https://default6694006439ae494ba9c7764d4876e1.45.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/27/workflows/ee9ba19858d04ce2b971a6b0e3a54d14/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=-EO3DUHzTBIBRyGzwLxhvqZa-dMxdmF75PdhW07eNnM";

    const postText = document.getElementById("postText");
    const loader = document.getElementById("loader");
    const copyBtn = document.getElementById("copyBtn");
    const regenBtn = document.getElementById("regenBtn");
    const errorMsg = document.getElementById("errorMsg");

    async function generatePost() {
      loader.classList.add("active");
      errorMsg.style.display = "none";
      copyBtn.textContent = "1. Kopiuj tekst";

      try {
        const res = await fetch(FLOW_URL, { method: "POST" });
        if (!res.ok) throw new Error(`Błąd serwera (${res.status})`);
        const text = await res.text();
        postText.value = text.trim();
      } catch (err) {
        errorMsg.textContent = "Nie udało się wygenerować posta. Spróbuj ponownie.";
        errorMsg.style.display = "block";
        console.error(err);
      } finally {
        loader.classList.remove("active");
      }
    }

    copyBtn.addEventListener("click", async () => {
      if (!postText.value) return;
      try {
        await navigator.clipboard.writeText(postText.value);
        copyBtn.textContent = "✓ Skopiowano! Teraz otwórz LinkedIn";
        setTimeout(() => {
          copyBtn.textContent = "1. Kopiuj tekst";
        }, 3000);
      } catch {
        postText.select();
        document.execCommand("copy");
        copyBtn.textContent = "✓ Skopiowano!";
      }
    });

    regenBtn.addEventListener("click", generatePost);

    // Automatyczne generowanie przy otwarciu strony z kodu QR
    generatePost();
  </script>
</body>
</html>
